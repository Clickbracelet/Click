document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);
    // Use Click's neutral warm-cream background instead of the prior pink-leaning canvas.
    template = template
      .replace('body{margin:0;background:#FAF7F2}', 'body{margin:0;background:#F5F0E8}')
      .replace('width: 100vw; height: 100vh; box-sizing: border-box; background: #FAF7F2;', 'width: 100vw; height: 100vh; box-sizing: border-box; background: #F5F0E8;')

        'body{margin:0;background:#F5F0E8}',
        'body{margin:0;background:#F5F0E8}@keyframes click-paired-ring{0%,100%{box-shadow:0 0 0 10px rgba(231,157,204,.62),0 0 18px rgba(155,108,201,.40)}50%{box-shadow:0 0 0 14px rgba(231,157,204,.40),0 0 42px rgba(155,108,201,.58)}}'
      )
      .replace(
        "pairCircleStyle: 'width: 180px; height: 180px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #F5F0E8; transition: box-shadow 0.4s; box-shadow: ' + (pairState === 'searching' ? '0 0 0 14px rgba(201,161,74,0.18), 0 0 0 30px rgba(201,161,74,0.08)' : (pairState === 'paired' ? '0 0 0 10px rgba(201,161,74,0.22)' : 'none')),",
        "pairCircleStyle: 'width: 180px; height: 180px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: #F5F0E8; transition: box-shadow 0.4s; animation: ' + (pairState === 'paired' ? 'click-paired-ring 1.65s ease-in-out infinite' : 'none') + '; box-shadow: ' + (pairState === 'searching' ? '0 0 0 14px rgba(201,161,74,0.18), 0 0 0 30px rgba(201,161,74,0.08)' : (pairState === 'paired' ? '0 0 0 10px rgba(231,157,204,.62), 0 0 18px rgba(155,108,201,.40)' : 'none')),"
      );

    // Keep the pitch flow honest: a Click profile needs a name, bio, and one usable social link.
    template = template
      .replace(
        '<input type="text" value="{{tag3}}" sc-camel-on-change="{{onTag3}}" placeholder="e.g., Coffee snob" aria-label="Third thing about you" style="height: 46px; box-sizing: border-box; border: 1px solid #E7DFD6; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C">\n</div>',
        '<input type="text" value="{{tag3}}" sc-camel-on-change="{{onTag3}}" placeholder="e.g., Coffee snob" aria-label="Third thing about you" style="height: 46px; box-sizing: border-box; border: 1px solid #E7DFD6; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C">\n<input type="text" value="{{tag4}}" sc-camel-on-change="{{onTag4}}" placeholder="e.g., Coffee lover" aria-label="Fourth interest or community" style="{{tag4Style}}">\n</div>\n<sc-if value="{{identityError}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 13px; line-height: 1.4; color: #B84F65">* Include a name and at least one interest or community.</p></sc-if>\n<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500">Bio\n<textarea value="{{profBio}}" sc-camel-on-change="{{onProfBio}}" placeholder="A little about you" aria-label="Bio" style="min-height: 82px; resize: vertical; box-sizing: border-box; border: 1px solid #E7DFD6; border-radius: 14px; background: #FFFFFF; padding: 12px 14px; font-size: 16px; color: #4A1A2C"></textarea>\n</label>'
      )
      .replace(
        "const onCount = PLATFORMS.filter((p) => s.on[p.id]).length + s.customLinks.length;",
        "const validOtherNames = ['Twitch', 'GitHub', 'Venmo', 'Substack', 'SoundCloud', 'Letterboxd', 'Goodreads', 'Strava', 'Other website'];\n    const isValidWebsite = (value) => /^(https?:\\/\\/)?([a-z0-9-]+\\.)+[a-z]{2,}(\\/.*)?$/i.test(value);\n    const validCustomLinks = s.customLinks.filter((c) => validOtherNames.indexOf(c.name) > -1 && c.handle.trim() && (c.name !== 'Other website' || isValidWebsite(c.handle.trim())));\n    const onCount = PLATFORMS.filter((p) => s.on[p.id]).length + validCustomLinks.length;\n    const hasSocial = PLATFORMS.some((p) => s.on[p.id] && (s.handles[p.id] || '').trim()) || validCustomLinks.length > 0;"
      )
      .replace(
        "profileNext: set({ screen: s.fromSettings ? 'settings' : 'socials' }),",
        "profileNext: () => { const st = this.state; const missingInterest = !st.tag1.trim() && !st.tag2.trim() && !st.tag3.trim() && !(st.tag4 || '').trim(); if (!st.profName.trim() || missingInterest) { this.setState({ profileIdentityError: true }); return; } this.setState({ screen: st.fromSettings ? 'settings' : 'socials', profileTried: false, profileIdentityError: false }); },"
      )
      .replace(
        "socialsNext: set({ screen: s.fromSettings ? 'settings' : 'presetsSetup' }),",
        "socialsNext: () => { if (!hasSocial) { this.setState({ socialError: true }); return; } this.setState({ screen: this.state.fromSettings ? 'settings' : 'presetsSetup', socialError: false }); },"
      )
      .replace(
        'Turn on an account and add your handle. Presets decide which ones you share.',
        'Add at least one account and handle. Presets decide which ones you share.'

      .replace(
        '<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #7A5E66">Add at least one account and handle. Presets decide which ones you share.</p>\n</div>\n<p style="margin: 0; font-size: 14px; font-weight: 600">{{socialCount}}</p>',
        '<p style="margin: 0; font-size: 16px; line-height: 1.5; color: #7A5E66">Add at least one account and handle. Presets decide which ones you share.</p>\n</div>\n<sc-if value="{{socialError}}" hint-placeholder-val="{{false}}"><p style="margin: 0; font-size: 13px; line-height: 1.4; color: #B84F65">* Add a handle or link for at least one social account to continue.</p></sc-if>\n<p style="margin: 0; font-size: 14px; font-weight: 600">{{socialCount}}</p>'
      )
      .replace(
        'style="height: 46px; box-sizing: border-box; border: 1px solid #E7DFD6; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C"',
        'style="{{tag1Style}}"'
      )
      .replace(
        '<input type="text" value="{{profName}}" sc-camel-on-change="{{onProfName}}" placeholder="Your name" style="height: 48px; box-sizing: border-box; border: 1px solid #E7DFD6; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C">',
        '<input type="text" value="{{profName}}" sc-camel-on-change="{{onProfName}}" placeholder="Your name" style="{{nameStyle}}">'
      )
      .replace('Three lines about you', 'Interests & Communities')
      .replace('e.g., Film student', 'e.g., Surfing')
      .replace('e.g., Surfer', 'e.g., Kappa Alpha Theta')
      .replace('e.g., Surfing', 'e.g., Surfer')
      .replace('e.g., Coffee snob', 'e.g., Architecture major')
      .replace(
        'const tags = [s.tag1, s.tag2, s.tag3].map((t) => t.trim()).filter(Boolean);',
        "const tags = [s.tag1, s.tag2, s.tag3, s.tag4 || ''].map((t) => t.trim()).filter(Boolean);\n    const nameError = !!s.profileIdentityError && !s.profName.trim();\n    const interestError = !!s.profileIdentityError && tags.length === 0;\n    const identityError = nameError || interestError;"
      )
      .replace(
        "displayTags: tags.length ? tags.join(' · ') : 'Three things about you',",
        "displayTags: tags.length ? tags.join(' · ') : 'Surfer · Kappa Alpha Theta · Architecture major · Coffee lover', displayTagsStyle: 'font-size: 13px; line-height: 1.35; color: ' + (tags.length ? '#7A5E66' : '#B8AFA9'),"
      )
      .replace(
        "socialCount: onCount === 0 ? 'No accounts added yet' : (onCount === 1 ? '1 account added' : onCount + ' accounts added'),",
        "socialError: !!s.socialError && !hasSocial, socialCount: onCount === 0 ? 'No accounts added yet' : (onCount === 1 ? '1 account added' : onCount + ' accounts added'),"
      )
      .replace(
        'onProfName: (e) => this.setState({ profName: e.target.value }),',
        "hasBio: !!s.profBio.trim(), identityError: identityError, nameStyle: 'height: 48px; box-sizing: border-box; border: ' + (nameError ? '2px solid #C96578' : '1px solid #E7DFD6') + '; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C', onProfName: (e) => this.setState({ profName: e.target.value }),"
      )
      .replace(
        '<input type="text" value="{{tag2}}" sc-camel-on-change="{{onTag2}}" placeholder="e.g., Surfer" aria-label="Second thing about you" style="height: 46px; box-sizing: border-box; border: 1px solid #E7DFD6; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C">',
        '<input type="text" value="{{tag2}}" sc-camel-on-change="{{onTag2}}" placeholder="e.g., Surfer" aria-label="Second thing about you" style="{{tag2Style}}">'
      )
      .replace(
        '<input type="text" value="{{tag3}}" sc-camel-on-change="{{onTag3}}" placeholder="e.g., Coffee snob" aria-label="Third thing about you" style="height: 46px; box-sizing: border-box; border: 1px solid #E7DFD6; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C">',
        '<input type="text" value="{{tag3}}" sc-camel-on-change="{{onTag3}}" placeholder="e.g., Coffee snob" aria-label="Third thing about you" style="{{tag3Style}}">'
      )
      .replace(
        '<input type="text" value="{{tag2}}" sc-camel-on-change="{{onTag2}}" placeholder="e.g., Kappa Alpha Theta" aria-label="Second thing about you" style="height: 46px; box-sizing: border-box; border: 1px solid #E7DFD6; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C">',
        '<input type="text" value="{{tag2}}" sc-camel-on-change="{{onTag2}}" placeholder="e.g., Kappa Alpha Theta" aria-label="Second thing about you" style="{{tag2Style}}">'
      )
      .replace(
        '<input type="text" value="{{tag3}}" sc-camel-on-change="{{onTag3}}" placeholder="e.g., Architecture major" aria-label="Third thing about you" style="height: 46px; box-sizing: border-box; border: 1px solid #E7DFD6; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C">',
        '<input type="text" value="{{tag3}}" sc-camel-on-change="{{onTag3}}" placeholder="e.g., Architecture major" aria-label="Third thing about you" style="{{tag3Style}}">'

        "profName: s.profName, tag1: s.tag1, tag2: s.tag2, tag3: s.tag3, tag4: s.tag4 || '', profBio: s.profBio, onTag4: (e) => this.setState({ tag4: e.target.value }), tag1Style: 'height: 46px; box-sizing: border-box; border: ' + (s.profileTried && !s.tag1.trim() && !s.tag2.trim() && !s.tag3.trim() && !(s.tag4 || '').trim() ? '2px solid #E8A7BC' : '1px solid #E7DFD6') + '; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C', tag2Style: 'height: 46px; box-sizing: border-box; border: ' + (s.profileTried && !s.tag1.trim() && !s.tag2.trim() && !s.tag3.trim() && !(s.tag4 || '').trim() ? '2px solid #E8A7BC' : '1px solid #E7DFD6') + '; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C', tag3Style: 'height: 46px; box-sizing: border-box; border: ' + (s.profileTried && !s.tag1.trim() && !s.tag2.trim() && !s.tag3.trim() && !(s.tag4 || '').trim() ? '2px solid #E8A7BC' : '1px solid #E7DFD6') + '; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C', tag4Style: 'height: 46px; box-sizing: border-box; border: ' + (s.profileTried && !s.tag1.trim() && !s.tag2.trim() && !s.tag3.trim() && !(s.tag4 || '').trim() ? '2px solid #E8A7BC' : '1px solid #E7DFD6') + '; border-radius: 14px; background: #FFFFFF; padding: 0 14px; font-size: 16px; color: #4A1A2C',"

    // Audrey is not part of the built-in prototype data. Saved Click records
    // from the signed-in account continue to be supplied separately by Supabase.
    template = template.replace(/\n  \{ id: 'audrey'[\s\S]*?\},\n(?=  \{ id: 'chloe')/, '\n');
    // Prototype rows get a stable first-seen timestamp. This lets their labels
    // naturally advance from Today to Yesterday to a calendar date, rather
    // than being frozen as the copy written into the demo fixture.
    patchOnce(
      'const CLICKS = CLICK_DATA;',
      `const demoClockKey = 'click-demo-clock-v1';
    let demoClock = Date.now();
    try {
      const savedDemoClock = Number(window.localStorage.getItem(demoClockKey));
      if (Number.isFinite(savedDemoClock) && savedDemoClock > 0) demoClock = savedDemoClock;
      else window.localStorage.setItem(demoClockKey, String(demoClock));
    } catch (_) { /* Private browsing can deny storage; the current clock still works. */ }
    const CLICKS = CLICK_DATA.map((click) => {
      if (click.clickedAt) return click;
      const eventTime = demoClock - (click.mins * 60000);
      const mins = Math.max(0, Math.round((Date.now() - eventTime) / 60000));
      return Object.assign({}, click, { mins: mins, when: clickWhen(new Date(eventTime), mins) });
    });`
    );

=\"button\" sc-camel-on-click=\"{{tabSettings}}\" style=\"{{tabSettingsStyle}}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8\"><\u002Fpath><\u002Fsvg>You<\u002Fbutton>\n<\u002Fnav>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}\">\n\nconst PH = {\n  chloe: '/_blob/6ff0ec4511c787373e78cbef272e61b9', leila: '/_blob/9eb8018d90c8078fe191e2d4ab39a7ae',\n  payton: '/_blob/e2eb7721272bac56a3289adb2ac6dffa', sadie: '/_blob/b596d6194a741019a38c9d3546583a3d', lola: '/_blob/1b99348a9f267c0bb2d27a7ddaa5c862'\n};\n// mins = minutes since the Click. years = age the person shared on their Click (null if not shared). hair = read from their profile photo.\nconst CLICK_DATA = [\n  { id: 'chloe', name: 'Chloe Malone', desc: 'Liberal Studies, Cal Poly · Flag Football #4 · Loves reading', photo: PH.chloe, years: null, hair: 'blonde', loc: 'Doerr Family Field, Cal Poly', event: '', mins: 20, when: '20 minutes ago', about: 'Liberal Studies major on the flag football team who loves reading books.', socials: [{ key: 'ig', plat: 'Instagram', handle: '@chloeemalone', action: 'Follow' }, { key: 'tt', plat: 'TikTok', handle: '@chloe.brynn', action: 'Follow' }, { key: 'sc', plat: 'Snapchat', handle: 'chloemalone4', action: 'Add' }] },\n  { id: 'leila', name: 'Leila Butler', desc: 'Landscape Architecture, Cal Poly · Flag Football #15 · Social Media Manager', photo: PH.leila, years: null, hair: 'brown', loc: 'Doerr Family Field, Cal Poly', event: '', mins: 22, when: '22 minutes ago', about: 'Surfs, draws, and runs the flag football team social media.', socials: [{ key: 'ig', plat: 'Instagram', handle: '@leilatani12', action: 'Follow' }, { key: 'tt', plat: 'TikTok', handle: '@leilatani', action: 'Follow' }, { key: 'sc', plat: 'Snapchat', handle: 'leilabutler12', action: 'Add' }] },\n  { id: 'payton', name: 'Payton Stern', desc: 'Interdisciplinary Studies, Cal Poly · Flag Football #3 · Outdoors', photo: PH.payton, years: null, hair: 'brown', loc: 'Doerr Family Field, Cal Poly', event: '', mins: 24, when: '24 minutes ago', about: 'Loves spending time outdoors and hiking.', socials: [{ key: 'ig', plat: 'Instagram', handle: '@payton.sternn', action: 'Follow' }, { key: 'tt', plat: 'TikTok', handle: '@payton_stern', action: 'Follow' }, { key: 'sc', plat: 'Snapchat', handle: 'paytonsternn', action: 'Add' }] },\n  { id: 'sadie', name: 'Sadie Roney', desc: 'Wine & Viticulture, Cal Poly · Flag Football #5 · Beach & Travel', photo: PH.sadie, years: null, hair: 'blonde', loc: 'Doerr Family Field, Cal Poly', event: '', mins: 26, when: '26 minutes ago', about: 'Loves sports, the beach, and traveling.', socials: [{ key: 'ig', plat: 'Instagram', handle: '@sadie_roney', action: 'Follow' }, { key: 'sc', plat: 'Snapchat', handle: 'sadieroney', action: 'Add' }] },\n  { id: 'lola', name: 'Lola Acosta', desc: 'Liberal Studies, Cal Poly · Flag Football #22 · Surfer', photo: PH.lola, years: null, hair: 'blonde', loc: 'Doerr Family Field, Cal Poly', event: '', mins: 28, when: '28 minutes ago', about: 'Loves playing sports, surfing, and any kind of exercise or workout.', socials: [{ key: 'ig', plat: 'Instagram', handle: '@lolabelle.22', action: 'Follow' }, { key: 'tt', plat: 'TikTok', handle: '@lolasspamzz22', action: 'Follow' }, { key: 'sc', plat: 'Snapchat', handle: 'lola.belle22', action: 'Add' }] },\n  { id: 'priya', name: 'Priya Patel', desc: 'Design major · Runner · Plant parent', photo: '', years: 19, hair: 'black', loc: 'Cal Poly, San Luis Obispo', event: 'Startup Launch Weekend', mins: 300, when: 'Today, 11:40 AM', about: 'Graphic design, running, plants.', socials: [{ key: 'ig', plat: 'Instagram', handle: '@priya.de key: 'ig', plat: 'Instagram', handle: '@leepark.photo', action: 'Follow' }, { key: 'web', plat: 'Website', handle: 'leepark.studio', action: 'Visit' }] }\n];\n\n// ---- Ask Click: reads every Click's profile, photo traits, place and time ----\nconst ASK_GROUPS = [\n  ['read','reads','reading','reader','book','books','bookworm','novel','novels','literature','poetry','library'],\n  ['surf','surfer','surfing','waves'],\n  ['beach','ocean','coast'],\n  ['music','musician','sing','singer','songwriter','dj','band','producer','produces','electro-pop'],\n  ['film','actor','acting','acts','theater','theatre','drama','movie','movies'],\n  ['electrical','engineering','engineer','circuits','circuit','hardware'],\n  ['develop','developer','code','coding','software','app'],\n  ['design','designer','graphic','architecture','architect','landscape'],\n  ['art','artist','draw','draws','drawing','photography','photographer','photo'],\n  ['marketing','social','media','content','brand','founder','startup','entrepreneur','entrepreneurship','business'],\n  ['outdoors','outdoor','hike','hiking','nature','camping','climb','climber','climbing'],\n  ['exercise','workout','gym','fitness','run','runner','running','sports','football','athlete'],\n  ['travel','traveling','trip','trips','adventure'],\n  ['wine','viticulture','vineyard'],\n  ['coffee','barista','food','foodie','cook','cooking'],\n  ['plants','plant','garden','gardening'],\n  ['thrift','thrifter','thrifting','fashion','jewelry']\n];\nconst ASK_LABELS = ['reading','surfing','the beach','music','film and acting','electrical engineering','coding','design','art','marketing and business','the outdoors','working out','travel','wine','coffee and food','plants','fashion'];\nconst ASK_STOP = 'who whos is are was were do does did i im me my anyone anybody someone people person that the a an any can could with in of and or to for about like likes into know knew met meet all every everyone show find list pull up give tell what which their there has have had invite bring go hang out new fun club group friend friends should would be been get old years year yrs aged age hair at from on this last past today yesterday week month contact contacts click clicks clicked thats whats it its im over under than older younger above below person persons anything something stuff'.split(' ');\nconst HAIR = { red: ['red','ginger','auburn','redhead','redheads','redheaded'], blonde: ['blonde','blond','blondes'], brown: ['brown','brunette','brunettes'], black: ['black'] };\nconst tok = (t) => String(t || '').toLowerCase().replace(/work(ing)?\\s*out/g, 'workout').replace(/book\\s*club/g, 'books').replace(/[^a-z0-9\\s-]/g, ' ').split(/\\s+/).filter(Boolean);\nconst stem = (w) => (w.length > 4 ? w.replace(/(ings|ing|ers|er|es|s)$/, '') : w);\nconst expandTerm = (t) => { let out = [t]; ASK_GROUPS.forEach((g) => { if (g.some((x) => stem(x) === stem(t))) out = out.concat(g); }); return out; };\nconst hitWord = (words, opts) => words.some((w) => opts.some((o) => w === o || stem(w) === stem(o) || (stem(o).length >= 5 && w.indexOf(stem(o)) === 0)));\n\nfunction askClick(q, people) {\n  const ql = ' ' + String(q).toLowerCase() + ' ';\n  const words = tok(q);\n  const used = {};\n  const filters = []; // { label, test(p) -> reason|false }\n  // Age\n  let m = ql.match(/(?:over|older than|above)\\s+(\\d{2})/);\n  if (m) { const n = +m[1]; used[m[1]] = 1; filters.push({ label: 'are over ' + n, test: (p) => p.years != null && p.years > n ? p.years + ' years old' : false }); }\n  m = ql.match(/(?:under|younger than|below)\\s+(\\d{2})/);\n  if (m) { const n = +m[1]; used[m[1]] = 1; filters.push({ label: 'are under ' + n, test: (p) => p.years != null && p.years < n ? p.years + ' years old' : false }); }\n  if (!filters.length) {\n    m = ql.match(/\\b(\\d{2})\\s*(?:yrs?|years?|y\\/?o|-?year-?olds?)\\b/) || (/\\b(old|age|aged)\\b/.test(ql) ? ql.match(/\\b(\\d{2})\\b/) : null) || ql.match(/\\b(?:is|are|turning)\\s+(\\d{2})\\b/);\n    if (m) { const n = +m[1]; used[m[1]] = 1; filters.push({ label: 'are ' + n, test: (p) => p.years === n ? p.years + ' years old' : false }); }\n  }\n  // Hair (read from profile photos)\n  Object.keys(HAIR).forEach((color) => {\n    const hit = HAIR[color].find((w) => words.indexOf(w) > -1);\n    if (hit && (ql.indexOf('hair') > -1 || /red ?head|ginger|blond|brunette/.test(ql))) {\n      HAIR[color].forEach((w) => { used[w] = 1; });\n      filters.push({ label: 'have ' + color + ' hair', test: (p) => p.hair === color ? color.charAt(0).toUpperCase() + color.slice(1) + ' hair, from their profile photo' : false });\n    }\n  });\n  // When\n  const T = [\n    [/last hour|past hour|this hour/, 0, 60, 'you clicked with in the last hour'],\n    [/\\btoday\\b|this morning|this afternoon|tonight/, 0, 720, 'you clicked with today'],\n    [/yesterday/, 720, 2880, 'you clicked with yesterday'],\n    [/this week|past week|last week/, 0, 10080, 'you clicked with this week'],\n    [/this month|past month|last month/, 0, 43200, 'you clicked with this month']\n  ];\n  T.forEach((t) => { if (t[0].test(ql)) filters.push({ label: t[3], test: (p) => p.mins >= t[1] && p.mins <= t[2] ? 'Clicked ' + p.when.replace(/^([A-Z])/, (c) => c.toLowerCase()) : false }); });\n  // Where\n  const placeOf = (p) => (p.event ? p.event + ', ' : '') + p.loc;\n  const GENERIC = ['cal','poly','san','luis','obispo','the','field','family','night','weekend'];\n  const placeWords = {};\n  people.forEach((p) => tok(placeOf(p)).forEach((w) => { if (w.length > 2 && GENERIC.indexOf(w) < 0) placeWords[w] = 1; }));\n  words.forEach((w) => { if (GENERIC.indexOf(w) > -1 && /\\b(at|in|from|near)\\b/.test(ql)) used[w] = 1; });\n  const wantPlace = words.filter((w) => placeWords[w] && !used[w] && /\\b(at|in|from|near)\\b/.test(ql) || (placeWords[w] && ['doerr','hackathon','avila','pismo','mixer','downtown','fair','mic'].indexOf(w) > -1));\n  if (wantPlace.length) {\n    wantPlace.forEach((w) => { used[w] = 1; });\n    const pf = { label: 'you met there', test: (p) => { const pw = tok(placeOf(p)); if (!wantPlace.every((w) => pw.indexOf(w) > -1)) return false; pf.label = 'you met at ' + placeOf(p); return 'Met at ' + placeOf(p); } };\n    filters.push(pf);\n  }\n  // Interests (profile + what they share on socials)\n  const corpus = {};\n  people.forEach((p) => tok(p.desc + ' ' + p.about).forEach((w) => { corpus[stem(w)] = 1; }));\n  const known = (w) => corpus[stem(w)] || ASK_GROUPS.some((g) => g.some((x) => stem(x) === stem(w)));\n  const terms = words.filter((w) => !used[w] && ASK_STOP.indexOf(w) < 0 && w.length > 1 && !/^\\d+$/.test(w) && !HAIR.red.concat(HAIR.blonde, HAIR.brown, HAIR.black).includes(w) && !placeWords[w] && known(w));\n  if (terms.length) {\n    const nice = terms.map((t) => { const gi = ASK_GROUPS.findIndex((g) => g.some((x) => stem(x) === stem(t))); return gi > -1 ? ASK_LABELS[gi] : t; }).filter((v, i, a) => a.indexOf(v) === i);\n    filters.push({ label: 'are into ' + nice.join(' and '), test: (p) => {\n      const txt = p.desc + '. ' + p.about;\n      const ok = terms.some((t) => hitWord(tok(txt), expandTerm(t)));\n      if (!ok) return false;\n      const all = []; terms.forEach((t) => { all.push.apply(all, expandTerm(t)); });\n      const part = txt.split(/\\s*[·.]\\s*/).find((seg) => hitWord(tok(seg), all)) || p.desc;\n      return part.trim();\n    } });\n  }\n  const everyone = /\\b(everyone|everybody|all my|list all|show all)\\b/.test(ql);\n  if (!filters.length && !everyone) {\n    return { text: 'I can find people by age, hair color in their photo, where or when you met, and anything they shared, like reading or surfing. Try one of the suggestions below.', people: [] };\n  }\n  const found = [];\n  people.forEach((p) => {\n    const reasons = [];\n    for (let i = 0; i < filters.length; i++) { const r = filters[i].test(p); if (!r) return; reasons.push(r); }\n    found.push({ id: p.id, reason: reasons.length ? reasons.join(' · ') : (p.when) });\n  });\n  const de
